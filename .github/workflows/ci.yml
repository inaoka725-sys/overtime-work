name: CI

# 旬報アプリは index.html 単体で動く。ビルドは無いので、検証するのは計算ロジックだけ。
# 実ブラウザで index.html を読み込み、規程どおりの値になるかを tests/calc.test.mjs で確認する。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  calc-regression:
    name: 計算ロジックの回帰テスト
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 依存関係を取得
        run: npm ci

      - name: ブラウザを取得
        run: npx playwright install --with-deps chromium

      - name: 回帰テスト
        run: npm test
